[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "claimguard-ai"
version = "3.0.0"
description = "RAG sur les règlements fédéraux 12 CFR (eCFR) et plaintes CFPB, aligné sur les labs 04-rag et 05-Evaluation"
requires-python = ">=3.11,<3.14"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["real: needs Qdrant running and the real models (python -m claimguard ingest)"]
